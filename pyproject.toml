[project]
name = "ha-filament-stock"
version = "0.1.0"
description = "Home Assistant integration: filament stock from the Bambu Lab cloud, print queue from Google Drive."
requires-python = ">=3.14"
license = "MIT"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["prototype*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "ASYNC", "S", "RUF", "PL", "TRY"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR2004", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "PLR0917", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components/filament_stock"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/filament_stock"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
