name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check manifest version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import json; print(json.load(open("custom_components/filament_stock/manifest.json"))["version"])')"
          test "$tag" = "$version" || { echo "tag $tag != manifest $version"; exit 1; }
      - name: Build zip
        run: cd custom_components/filament_stock && zip -r "$GITHUB_WORKSPACE/filament_stock.zip" . -x "__pycache__/*"
      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" filament_stock.zip --clobber
